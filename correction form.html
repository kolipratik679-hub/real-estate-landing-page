<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  margin:0;
  background:#eaf5f8;
}

/* MAIN SECTION */
.contact-section{
  padding:40px 20px;
}

/* WRAPPER */
.contact-wrapper{
  max-width:1200px;
  margin:auto;
  display:flex;
  gap:30px;
  align-items:stretch; /* ✅ equal height */
}

/* LEFT FORM */
.contact-left{
  flex:1;
}

.contact-left h2{
  font-size:36px;
  margin-bottom:10px;
  color:#222;
}

.contact-left p{
  color:#555;
  margin-bottom:25px;
}

.contact-form input,
.contact-form select,
.contact-form textarea{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:1px solid #dcdcdc;
  border-radius:8px;
  font-size:14px;
}

.form-row{
  display:flex;
  gap:15px;
}

.contact-form textarea{
  resize:none;
  height:120px;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  color:#555;
  margin-bottom:20px;
}

.contact-form button{
  width:100%;
  background:#0a4d78;
  color:#fff;
  border:none;
  padding:16px;
  font-size:15px;
  border-radius:8px;
  cursor:pointer;
}

/* RIGHT MAP CARD */
.contact-right{
  flex:1;
  background:#fff;
  border-radius:18px;
  padding:20px;
  display:flex;
  flex-direction:column;
}

/* MAP BOX */
.map-box{
  width:100%;
  height:300px;
  border-radius:14px;
  overflow:hidden;
}

.map-box iframe{
  width:100%;
  height:100%;
  border:0;
}

/* MAP INFO (ALAG BOX) */
.contact-info{
  margin-top:15px;
}

.contact-info p{
  margin:8px 0;
  font-size:14px;
  color:#0a4d78;
}

/* SOCIAL ICONS */
.social-icons{
  margin-top:15px;
}

.social-icons span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border:1px solid #0a4d78;
  border-radius:50%;
  margin-right:8px;
  font-weight:500;
}

/* 📱 MOBILE RESPONSIVE */
@media(max-width:768px){
  .contact-wrapper{
    flex-direction:column;
  }

  .contact-left h2{
    font-size:28px;
  }

  .form-row{
    flex-direction:column;
  }

  .map-box{
    height:250px;
  }
}
</style>
</head>

<body>

<section class="contact-section">
  <div class="contact-wrapper">

    <!-- LEFT FORM -->
    <div class="contact-left">
      <h2>Get in touch with us</h2>
      <p>Find the best deal on homes in your area. Let us help you.</p>

      <form class="contact-form">
        <select>
          <option>Select</option>
        </select>

        <input type="text" placeholder="Name">

        <div class="form-row">
          <input type="email" placeholder="Email">
          <input type="text" placeholder="Phone">
        </div>

        <div class="form-row">
          <input type="text" placeholder="City">
          <input type="text" placeholder="Zip Code">
        </div>

        <textarea placeholder="Message"></textarea>

        <div class="checkbox">
          <input type="checkbox">
          <label>I consent to having this website store my submitted information</label>
        </div>

        <button type="submit">SUBMIT</button>
      </form>
    </div>

    <!-- RIGHT MAP -->
    <div class="contact-right">

      <div class="map-box">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.880827991313!2d73.0147!3d19.0203!2m3!1f0!2f0!3f0"
          loading="lazy">
        </iframe>
      </div>

      <div class="contact-info">
        <p>📍 Shop no 3, Future Gold CHS, Sector 44,<br>Seawoods West - 400706</p>
        <p>📞 8879535104 / 8369139899</p>

        <div class="social-icons">
          <span>F</span>
          <span>T</span>
          <span>I</span>
          <span>L</span>
        </div>
      </div>

    </div>

  </div>
</section>

</body>
</html>
